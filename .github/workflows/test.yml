name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline synthetic tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell entry points
        run: sh -n scripts/install.sh scripts/rollback.sh
